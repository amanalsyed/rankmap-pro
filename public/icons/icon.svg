<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="RankMap Pro">
  <defs>
    <linearGradient id="bg" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#312e81" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- App-style rounded tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Map pin -->
  <g filter="url(#shadow)">
    <path
      fill="#ffffff"
      d="M64 28c-13.8 0-25 11.2-25 25 0 18.2 25 47 25 47s25-28.8 25-47c0-13.8-11.2-25-25-25zm0 34.5a9.5 9.5 0 1 1 0-19 9.5 9.5 0 0 1 0 19z"
    />
  </g>
  <!-- Rank badge (#1) -->
  <circle cx="88" cy="36" r="20" fill="#34a853" stroke="#ffffff" stroke-width="4"/>
  <text
    x="88"
    y="44"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="700"
  >1</text>
</svg>
