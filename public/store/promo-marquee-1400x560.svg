<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <defs>
    <radialGradient id="bgGlow" cx="42%" cy="42%" r="85%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </radialGradient>
    <linearGradient id="iconFace" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="45%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="iconEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pillFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a4a72"/>
      <stop offset="100%" stop-color="#1a3352"/>
    </linearGradient>
    <filter id="iconShadow" x="-25%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <filter id="titleShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1400" height="560" fill="url(#bgGlow)"/>

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" fill="none">
    <path d="M0 112h1400M0 224h1400M0 336h1400M0 448h1400M112 0v504M224 0v504M336 0v504M448 0v504M560 0v504M672 0v504M784 0v504M896 0v504M1008 0v504M1120 0v504M1232 0v504"/>
  </g>

  <!-- Soft right-side glow -->
  <ellipse cx="1100" cy="260" rx="320" ry="220" fill="#3b82f6" opacity="0.07"/>

  <!-- 3D app icon -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="152" width="200" height="200" rx="48" fill="url(#iconFace)"/>
    <rect x="100" y="152" width="200" height="96" rx="48" fill="url(#iconEdge)"/>
    <path fill="#ffffff" d="M200 208c-21.5 0-39 17.5-39 39 0 28.2 39 72 39 72s39-43.8 39-72c0-21.5-17.5-39-39-39zm0 51a12 12 0 1 1 0-24 12 12 0 0 1 0 24z"/>
    <circle cx="262" cy="182" r="28" fill="#22c55e" stroke="#ffffff" stroke-width="5"/>
    <text x="262" y="193" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">1</text>
  </g>

  <!-- Title block -->
  <g filter="url(#titleShadow)">
    <text x="360" y="210" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" letter-spacing="-1.5">RankMap Pro</text>
  </g>
  <text x="360" y="262" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600">Local SEO tools for Google Maps</text>

  <!-- Embossed pills (2x2, larger) -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
    <rect x="360" y="300" width="300" height="52" rx="26" fill="url(#pillFill)" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="2"/>
    <text x="510" y="333" text-anchor="middle" fill="#f8fafc">No-website leads</text>

    <rect x="676" y="300" width="240" height="52" rx="26" fill="url(#pillFill)" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="2"/>
    <text x="796" y="333" text-anchor="middle" fill="#f8fafc">GBP audits</text>

    <rect x="360" y="368" width="240" height="52" rx="26" fill="url(#pillFill)" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="2"/>
    <text x="480" y="401" text-anchor="middle" fill="#f8fafc">Rank checks</text>

    <rect x="616" y="368" width="240" height="52" rx="26" fill="url(#pillFill)" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="2"/>
    <text x="736" y="401" text-anchor="middle" fill="#f8fafc">Local scans</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="504" width="1400" height="56" fill="#070d18"/>
  <line x1="0" y1="504" x2="1400" y2="504" stroke="#334155" stroke-opacity="0.8"/>
  <text x="700" y="540" text-anchor="middle" fill="#f1f5f9" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">Find leads - Audit GBP - Check rankings - Export reports</text>
</svg>
