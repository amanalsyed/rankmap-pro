<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="75%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="55%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </radialGradient>
    <linearGradient id="iconFace" x1="0" y1="0" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="45%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="iconEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pillFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a4a72"/>
      <stop offset="100%" stop-color="#1a3352"/>
    </linearGradient>
    <filter id="iconShadow" x="-25%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <filter id="titleShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="440" height="280" fill="url(#bgGlow)"/>

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" fill="none">
    <path d="M0 56h440M0 112h440M0 168h440M0 224h440M56 0v232M112 0v232M168 0v232M224 0v232M280 0v232M336 0v232M392 0v232"/>
  </g>

  <!-- 3D app icon -->
  <g filter="url(#iconShadow)">
    <rect x="42" y="72" width="108" height="108" rx="26" fill="url(#iconFace)"/>
    <rect x="42" y="72" width="108" height="52" rx="26" fill="url(#iconEdge)"/>
    <path fill="#ffffff" d="M96 98c-11.6 0-21 9.4-21 21 0 15.2 21 39 21 39s21-23.8 21-39c0-11.6-9.4-21-21-21zm0 27.5a6.5 6.5 0 1 1 0-13 6.5 6.5 0 0 1 0 13z"/>
    <circle cx="128" cy="88" r="15" fill="#22c55e" stroke="#ffffff" stroke-width="3"/>
    <text x="128" y="94" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">1</text>
  </g>

  <!-- Title -->
  <g filter="url(#titleShadow)">
    <text x="168" y="104" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">RankMap Pro</text>
  </g>
  <text x="168" y="130" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">Local SEO tools for Google Maps</text>

  <!-- Embossed pills -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">
    <rect x="168" y="148" width="138" height="32" rx="16" fill="url(#pillFill)" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="237" y="169" text-anchor="middle" fill="#f8fafc">No-website leads</text>

    <rect x="314" y="148" width="98" height="32" rx="16" fill="url(#pillFill)" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="363" y="169" text-anchor="middle" fill="#f8fafc">GBP audits</text>

    <rect x="168" y="190" width="108" height="32" rx="16" fill="url(#pillFill)" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="222" y="211" text-anchor="middle" fill="#f8fafc">Rank checks</text>

    <rect x="284" y="190" width="108" height="32" rx="16" fill="url(#pillFill)" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="338" y="211" text-anchor="middle" fill="#f8fafc">Local scans</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="232" width="440" height="48" fill="#070d18"/>
  <line x1="0" y1="232" x2="440" y2="232" stroke="#334155" stroke-opacity="0.8"/>
  <text x="220" y="262" text-anchor="middle" fill="#f1f5f9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Find leads - Audit GBP - Check rankings - Export reports</text>
</svg>
